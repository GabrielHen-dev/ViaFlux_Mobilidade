name: CI Pipeline

on:
  pull_request:
    branches: [main, dev]
  push:
    branches: [main, dev]
  workflow_dispatch:

jobs:

  web:
    name: Lint, Testes e Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./apps/web

    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Configurar ambiente
        uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: 'npm'
          cache-dependency-path: 'apps/web/package-lock.json'
      
      - name: Instalar dependências
        run: npm ci

      - name: Executar Linter
        run: npm run lint

      - name: Verificar Tipos (TypeScript)
        run: npm run typecheck

      - name: Executar Build da Aplicação
        run: npm run build

      - name: Executar Testes
        run: npm test
  api:
    name: API - Maven verify (PostgreSQL 16)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: apps/api
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: apps/api/pom.xml
      - name: Maven verify com Testcontainers
        run: ./mvnw -B -ntp verify
      - name: Publicar relatórios de testes em caso de falha
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: api-test-reports
          path: apps/api/target/surefire-reports/
          if-no-files-found: ignore

  docker-web:
    name:  Web - Docker build
    runs-on: ubuntu-latest
    needs: web
    steps:
      - name: Checkout do código
        uses: actions/checkout@v4
      - name: Validar Build do Container
        run: docker build ./apps/web -t app-ci-check:latest