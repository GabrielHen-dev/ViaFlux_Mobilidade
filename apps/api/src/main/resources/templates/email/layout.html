<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="x-apple-disable-message-reformatting">
<meta name="color-scheme" content="light">
<meta name="supported-color-schemes" content="light">
<title>{{assunto}}</title>
</head>
<body style="margin:0;padding:0;background-color:#F8FAFC;-webkit-text-size-adjust:100%;-ms-text-size-adjust:100%;">
<table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" style="background-color:#F8FAFC;">
  <tr>
    <td align="center" style="padding:32px 16px;">
      <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" style="max-width:600px;width:100%;">
        <tr>
          <td style="background-color:#0F2C59;border-radius:16px 16px 0 0;padding:22px 32px;">
            <table role="presentation" cellpadding="0" cellspacing="0" border="0">
              <tr>
                <td width="32" height="32" align="center" valign="middle" style="width:32px;height:32px;background-color:#10B981;background-image:linear-gradient(135deg,#2563EB 0%,#10B981 100%);border-radius:8px;font-family:Montserrat,'Segoe UI',Arial,sans-serif;font-size:16px;font-weight:800;color:#FFFFFF;line-height:32px;">V</td>
                <td style="padding-left:12px;font-family:Montserrat,'Segoe UI',Arial,sans-serif;font-size:19px;font-weight:700;line-height:24px;letter-spacing:-0.2px;">
                  <span style="color:#FFFFFF;">ViaFlux</span> <span style="color:#10B981;">Mobilidade</span>
                </td>
              </tr>
            </table>
          </td>
        </tr>
        <tr>
          <td style="background-color:#FFFFFF;border:1px solid #E2E8F0;border-top:0;border-radius:0 0 16px 16px;padding:36px 32px 32px;">
            <h1 style="margin:0 0 20px;font-family:Montserrat,'Segoe UI',Arial,sans-serif;font-size:22px;font-weight:700;line-height:30px;color:#1E293B;">{{titulo}}</h1>
            <div style="font-family:Inter,'Segoe UI',Arial,sans-serif;font-size:15px;line-height:24px;color:#475569;">
{{conteudo}}
            </div>
            <table role="presentation" cellpadding="0" cellspacing="0" border="0" style="margin:28px 0 8px;">
              <tr>
                <td align="center" bgcolor="#10B981" style="background-color:#10B981;border-radius:12px;">
                  <a href="{{link}}" target="_blank" style="display:inline-block;padding:14px 28px;font-family:Inter,'Segoe UI',Arial,sans-serif;font-size:15px;font-weight:600;line-height:20px;color:#FFFFFF;text-decoration:none;border-radius:12px;">{{acao}}</a>
                </td>
              </tr>
            </table>
            <p style="margin:24px 0 0;padding-top:20px;border-top:1px solid #E2E8F0;font-family:Inter,'Segoe UI',Arial,sans-serif;font-size:12px;line-height:18px;color:#64748B;">
              Se o botão não funcionar, copie e cole este endereço no navegador:<br>
              <a href="{{link}}" target="_blank" style="color:#2563EB;text-decoration:underline;word-break:break-all;">{{link}}</a>
            </p>
          </td>
        </tr>
        <tr>
          <td align="center" style="padding:24px 16px 0;font-family:Inter,'Segoe UI',Arial,sans-serif;font-size:12px;line-height:18px;color:#94A3B8;">
            ViaFlux Mobilidade<br>
            Mensagem automática. Não responda este e-mail.
          </td>
        </tr>
      </table>
    </td>
  </tr>
</table>
</body>
</html>
