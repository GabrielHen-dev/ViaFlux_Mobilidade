<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="x-apple-disable-message-reformatting">
<meta name="color-scheme" content="light">
<meta name="supported-color-schemes" content="light">
<title>{{assunto}}</title>
</head>
<body style="margin:0;padding:0;background-color:#F4F6F8;-webkit-text-size-adjust:100%;-ms-text-size-adjust:100%;">
<table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" style="background-color:#F4F6F8;">
  <tr>
    <td align="center" style="padding:32px 16px;">
      <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" style="max-width:600px;width:100%;">
        <tr>
          <td style="background-color:#FFFFFF;border:1px solid #E2E5EA;border-top:3px solid #F2A900;border-radius:4px;">
            <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0">
              <tr>
                <td style="padding:16px 32px;border-bottom:1px solid #E2E5EA;">
                  <table role="presentation" cellpadding="0" cellspacing="0" border="0">
                    <tr>
                      <td width="32" height="32" align="center" valign="middle" bgcolor="#0B2545" style="width:32px;height:32px;background-color:#0B2545;border-radius:7px;font-family:Roboto,'Segoe UI',Arial,sans-serif;font-size:17px;font-weight:700;line-height:32px;color:#FFFFFF;border-bottom:2px solid #F2A900;">V</td>
                      <td style="padding-left:10px;font-family:Roboto,'Segoe UI',Arial,sans-serif;">
                        <span style="display:block;font-size:18px;font-weight:700;line-height:20px;color:#0B2545;">Via<span style="color:#0F5BA7;">Flux</span></span>
                        <span style="display:block;margin-top:2px;font-size:10px;font-weight:500;line-height:12px;letter-spacing:2px;text-transform:uppercase;color:#6B7280;">Mobilidade</span>
                      </td>
                    </tr>
                  </table>
                </td>
              </tr>
              <tr>
                <td style="padding:28px 32px 32px;">
                  <h1 style="margin:0 0 20px;font-family:Roboto,'Segoe UI',Arial,sans-serif;font-size:20px;font-weight:500;line-height:28px;color:#1F2937;">{{titulo}}</h1>
                  <div style="font-family:Roboto,'Segoe UI',Arial,sans-serif;font-size:14px;line-height:22px;color:#4B5563;">
{{conteudo}}
                  </div>
                  <table role="presentation" cellpadding="0" cellspacing="0" border="0" style="margin:28px 0 8px;">
                    <tr>
                      <td align="center" bgcolor="#0F5BA7" style="background-color:#0F5BA7;border:1px solid #0F5BA7;border-radius:3px;">
                        <a href="{{link}}" target="_blank" style="display:inline-block;padding:12px 24px;font-family:Roboto,'Segoe UI',Arial,sans-serif;font-size:13px;font-weight:500;line-height:16px;letter-spacing:0.5px;text-transform:uppercase;color:#FFFFFF;text-decoration:none;border-radius:3px;">{{acao}}</a>
                      </td>
                    </tr>
                  </table>
                  <p style="margin:24px 0 0;padding-top:16px;border-top:1px solid #E2E5EA;font-family:Roboto,'Segoe UI',Arial,sans-serif;font-size:12px;line-height:18px;color:#6B7280;">
                    Se o botão não funcionar, copie e cole este endereço no navegador:<br>
                    <a href="{{link}}" target="_blank" style="color:#0F5BA7;text-decoration:underline;word-break:break-all;">{{link}}</a>
                  </p>
                </td>
              </tr>
            </table>
          </td>
        </tr>
        <tr>
          <td align="center" style="padding:20px 16px 0;font-family:Roboto,'Segoe UI',Arial,sans-serif;font-size:12px;line-height:18px;color:#6B7280;">
            ViaFlux Mobilidade<br>
            Mensagem automática. Não responda este e-mail.
          </td>
        </tr>
      </table>
    </td>
  </tr>
</table>
</body>
</html>
