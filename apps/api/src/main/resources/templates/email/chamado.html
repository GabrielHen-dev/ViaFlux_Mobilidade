<p style="margin:0 0 16px;font-family:Roboto,'Segoe UI',Arial,sans-serif;font-size:14px;line-height:22px;color:#1F2937;">Olá, {{nome}}.</p>
<table role="presentation" cellpadding="0" cellspacing="0" border="0" style="margin:0 0 16px;">
  <tr>
    <td style="padding-right:10px;font-family:Roboto,'Segoe UI',Arial,sans-serif;font-size:15px;font-weight:500;line-height:22px;color:#1F2937;">Chamado {{codigo}}</td>
    <td style="background-color:{{fundoDoStatus}};border-radius:3px;padding:3px 8px;font-family:Roboto,'Segoe UI',Arial,sans-serif;font-size:12px;font-weight:500;line-height:16px;color:{{corDoStatus}};white-space:nowrap;">{{status}}</td>
  </tr>
</table>
<p style="margin:0 0 16px;font-family:Roboto,'Segoe UI',Arial,sans-serif;font-size:14px;line-height:22px;color:#4B5563;">{{mensagem}}</p>
