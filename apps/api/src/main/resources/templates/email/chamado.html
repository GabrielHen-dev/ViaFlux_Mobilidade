    <td style="padding-right:10px;font-family:Montserrat,'Segoe UI',Arial,sans-serif;font-size:15px;font-weight:700;line-height:24px;color:#1E293B;">Chamado {{codigo}}</td>
    <td style="background-color:{{fundoDoStatus}};border-radius:999px;padding:4px 12px;font-family:Inter,'Segoe UI',Arial,sans-serif;font-size:12px;font-weight:600;line-height:16px;color:{{corDoStatus}};white-space:nowrap;">{{status}}</td>
  </tr>

<p style="margin:0 0 16px;font-family:Inter,'Segoe UI',Arial,sans-serif;font-size:15px;line-height:24px;color:#475569;">{{mensagem}}</p>
