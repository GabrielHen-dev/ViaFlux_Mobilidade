server:
  port: 8281

spring:
  application:
    name: viaflux-api
  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.security.servlet.UserDetailsServiceAutoConfiguration
  config:
    import: optional:file:${VIAFLUX_ENV_FILE:../../infra/.env}[.properties]
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:5432}/${POSTGRES_DB:viaflux}}
    username: ${SPRING_DATASOURCE_USERNAME:${POSTGRES_USER:viaflux}}
    password: ${SPRING_DATASOURCE_PASSWORD:${POSTGRES_PASSWORD}}
    driver-class-name: org.postgresql.Driver
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        default_schema: viaflux
  flyway:
    enabled: true
    default-schema: public
    locations: classpath:db/migration
  servlet:
    multipart:
      max-file-size: ${VIAFLUX_ANEXO_LIMITE_MB:${ANEXO_LIMITE_MB:10}}MB
      max-request-size: ${VIAFLUX_ANEXO_LIMITE_MB:${ANEXO_LIMITE_MB:10}}MB

viaflux:
  jwt:
    secret: ${VIAFLUX_JWT_SECRET:${JWT_SECRET:}}
    access-ttl: ${VIAFLUX_JWT_ACCESS_TTL:${JWT_ACCESS_TTL:PT15M}}
    refresh-ttl: ${VIAFLUX_JWT_REFRESH_TTL:${JWT_REFRESH_TTL:P7D}}
  cors:
    allowed-origins: ${VIAFLUX_CORS_ALLOWED_ORIGINS:${CORS_ALLOWED_ORIGINS:http://localhost:5261}}
  admin:
    email: ${VIAFLUX_ADMIN_EMAIL:${ADMIN_EMAIL:}}
    senha: ${VIAFLUX_ADMIN_PASSWORD:${ADMIN_PASSWORD:}}
  dev-tools:
    habilitado: ${VIAFLUX_DEV_TOOLS_HABILITADO:${DEV_TOOLS_HABILITADO:false}}
    senha-dos-usuarios: ${VIAFLUX_DEV_TOOLS_SENHA:${DEV_TOOLS_SENHA:}}
  triagem:
    urgencia-alta-minutos: ${VIAFLUX_TRIAGEM_URGENCIA_ALTA_MINUTOS:${TRIAGEM_URGENCIA_ALTA_MINUTOS:10}}
    urgencia-media-minutos: ${VIAFLUX_TRIAGEM_URGENCIA_MEDIA_MINUTOS:${TRIAGEM_URGENCIA_MEDIA_MINUTOS:20}}
    urgencia-baixa-minutos: ${VIAFLUX_TRIAGEM_URGENCIA_BAIXA_MINUTOS:${TRIAGEM_URGENCIA_BAIXA_MINUTOS:40}}
  anexos:
    diretorio: ${VIAFLUX_ANEXO_DIR:${ANEXO_DIR:./data/anexos}}
    limite-mb: ${VIAFLUX_ANEXO_LIMITE_MB:${ANEXO_LIMITE_MB:10}}
  enderecos:
    nominatim-url: ${VIAFLUX_NOMINATIM_URL:${NOMINATIM_URL:https://nominatim.openstreetmap.org}}
    viacep-url: ${VIAFLUX_VIACEP_URL:${VIACEP_URL:https://viacep.com.br}}
    user-agent: ${VIAFLUX_ENDERECOS_USER_AGENT:${ENDERECOS_USER_AGENT:ViaFlux-Mobilidade/1.0 (residencia-avanade-squad03)}}

management:
  endpoints:
    web:
      base-path: /
      exposure:
        include: health
      path-mapping:
        health: health
  endpoint:
    health:
      show-details: never

springdoc:
  api-docs:
    enabled: ${VIAFLUX_OPENAPI_ENABLED:true}
  swagger-ui:
    enabled: ${VIAFLUX_OPENAPI_ENABLED:true}
