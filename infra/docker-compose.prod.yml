name: viaflux

services:
  web:
    build:
      context: ../apps/web
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:?defina NEXT_PUBLIC_API_URL com o endereço público da API}
    restart: unless-stopped
    environment:
      NODE_ENV: production
      TZ: America/Recife
    expose:
      - "5261"
    ports:
      - "5261:5261"
    networks:
      - viaflux
    depends_on:
      api:
        condition: service_healthy

  api:
    build:
      context: ../apps/api
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://viaflux-db:5432/${POSTGRES_DB}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:?defina POSTGRES_PASSWORD}
      VIAFLUX_JWT_SECRET: ${JWT_SECRET:?defina JWT_SECRET}
      VIAFLUX_JWT_ACCESS_TTL: ${JWT_ACCESS_TTL:-PT15M}
      VIAFLUX_JWT_REFRESH_TTL: ${JWT_REFRESH_TTL:-P7D}
      VIAFLUX_CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:?defina CORS_ALLOWED_ORIGINS com o endereço público do frontend}
      VIAFLUX_ADMIN_EMAIL: ${ADMIN_EMAIL:-}
      VIAFLUX_ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
      VIAFLUX_ANEXO_DIR: /var/viaflux/anexos
      TZ: America/Recife
    expose:
      - "8281"
    ports:
      - "8281:8281"
    volumes:
      - anexos:/var/viaflux/anexos
    networks:
      - viaflux
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8281/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 60s

  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?defina POSTGRES_PASSWORD}
      TZ: America/Recife
    volumes:
      - db-data:/var/lib/postgresql/data
      - backups:/backups
    networks:
      viaflux:
        aliases:
          - viaflux-db
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

networks:
  viaflux:

volumes:
  db-data:
  anexos:
  backups:
