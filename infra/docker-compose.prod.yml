name: viaflux

services:
  web:
    build:
      context: ../apps/web
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:?defina NEXT_PUBLIC_API_URL com o endereço público da API}
    restart: unless-stopped
    environment:
      NODE_ENV: production
      TZ: America/Recife
    expose:
      - "5261"
    ports:
      - "5261:5261"
    networks:
      - viaflux
    depends_on:
      api:
        condition: service_healthy

  api:
    build:
      context: ../apps/api
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://viaflux-db:5432/${POSTGRES_DB}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:?defina POSTGRES_PASSWORD}
      VIAFLUX_JWT_SECRET: ${JWT_SECRET:?defina JWT_SECRET}
      VIAFLUX_JWT_ACCESS_TTL: ${JWT_ACCESS_TTL:-PT15M}
      VIAFLUX_JWT_REFRESH_TTL: ${JWT_REFRESH_TTL:-P7D}
      VIAFLUX_CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:?defina CORS_ALLOWED_ORIGINS com o endereço público do frontend}
      VIAFLUX_ADMIN_EMAIL: ${ADMIN_EMAIL:-}
      VIAFLUX_ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
      VIAFLUX_DEV_TOOLS_HABILITADO: ${DEV_TOOLS_HABILITADO:-false}
      VIAFLUX_DEV_TOOLS_SENHA: ${DEV_TOOLS_SENHA:-}
      VIAFLUX_ANEXO_DIR: /var/viaflux/anexos
      VIAFLUX_ANEXO_ARMAZENAMENTO: ${ANEXO_ARMAZENAMENTO:-disco}
      VIAFLUX_S3_ENDPOINT: ${S3_ENDPOINT:-}
      VIAFLUX_S3_REGIAO: ${S3_REGIAO:-auto}
      VIAFLUX_S3_BUCKET: ${S3_BUCKET:-}
      VIAFLUX_S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:-}
      VIAFLUX_S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:-}
      VIAFLUX_S3_PREFIXO: ${S3_PREFIXO:-}
      VIAFLUX_S3_PATH_STYLE: ${S3_PATH_STYLE:-true}
      VIAFLUX_PORTAL_URL: ${PORTAL_URL:?defina PORTAL_URL com o endereço público do frontend}
      VIAFLUX_MAIL_HOST: ${MAIL_HOST:?defina MAIL_HOST com o servidor SMTP}
      VIAFLUX_MAIL_PORT: ${MAIL_PORT:-587}
      VIAFLUX_MAIL_USERNAME: ${MAIL_USERNAME:-}
      VIAFLUX_MAIL_PASSWORD: ${MAIL_PASSWORD:-}
      VIAFLUX_MAIL_SMTP_AUTH: ${MAIL_SMTP_AUTH:-true}
      VIAFLUX_MAIL_STARTTLS: ${MAIL_STARTTLS:-true}
      VIAFLUX_MAIL_REMETENTE: ${MAIL_REMETENTE:-ViaFlux Mobilidade <nao-responda@viaflux.local>}
      VIAFLUX_VALIDADE_CONVITE: ${VALIDADE_CONVITE:-P7D}
      TZ: America/Recife
    expose:
      - "8281"
    ports:
      - "8281:8281"
    volumes:
      - anexos:/var/viaflux/anexos
    networks:
      - viaflux
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8281/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 60s

  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?defina POSTGRES_PASSWORD}
      TZ: America/Recife
    volumes:
      - db-data:/var/lib/postgresql/data
      - backups:/backups
    networks:
      viaflux:
        aliases:
          - viaflux-db
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

networks:
  viaflux:

volumes:
  db-data:
  anexos:
  backups:
